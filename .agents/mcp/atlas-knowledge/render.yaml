services:
  - type: web
    name: mcp-atlas-tecnm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ATLAS_DB_PATH
        value: /app/atlas_knowledge.db
