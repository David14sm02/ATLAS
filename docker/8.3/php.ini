[PHP]
; --------------------------------------------------------------------------
; Parche y Hardening de Seguridad PHP (CVE-2026-109618 / CVE-2026-109619)
; --------------------------------------------------------------------------

; Límites controlados de memoria y ejecución (Previene heap exhaustion y OOM)
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; Tamaños de subida razonables para evidencias PDF/Excel
post_max_size = 25M
upload_max_filesize = 25M

; MITIGACIÓN CRÍTICA PHP2Shell (CVE-2026-109618 y CVE-2026-109619):
; Desactivar el upload progress evita la corrupción de memoria por longjmp
; en cancelaciones abruptas y el Use-After-Free entre peticiones del worker.
session.upload_progress.enabled = 0

; Protección contra Remote/Local File Inclusion
allow_url_fopen = On
allow_url_include = Off

; Ocultar la versión e información del motor PHP a escáneres web
expose_php = Off

; Prevención de fuga de información de depuración
display_errors = Off
display_startup_errors = Off
log_errors = On

; Variables de entorno y configuración para Laravel
variables_order = EGPCS
pcov.directory = .
